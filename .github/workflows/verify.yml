name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
        with:
          version: 0.10.17+d971670cd
          core-version: 0.10.17+d971670cd
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: moon update
      - run: moon fmt --check
      - run: moon info
      - run: git diff --exit-code -- engine
      - run: moon check --target all --deny-warn
      - run: moon test --target wasm --deny-warn
      - run: moon test --target wasm-gc --deny-warn
      - run: moon test --target js --deny-warn
      - run: moon run engine/cli -- --help
      - run: moon run --target js engine/cli -- --help
      - run: moon run --target wasm-gc engine/cli -- --help
      - run: moon run --deny-warn checks/examples.mbtx
      - run: moon run --deny-warn checks/consumer.mbtx
      - run: moon package
      - if: runner.os == 'Linux'
        run: python -m pip install jsonschema==4.25.1
      - if: runner.os == 'Linux'
        run: moon run --deny-warn checks/sarif-schema.mbtx
      - if: runner.os != 'Windows'
        run: moon test --target native --deny-warn
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moonddl_guard_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moonddl_guard_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 15432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: moonddl_guard_test
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
        with:
          version: 0.10.17+d971670cd
          core-version: 0.10.17+d971670cd
      - run: moon update
      - run: sudo apt-get update
      - run: sudo apt-get install -y postgresql-client
      - run: psql --version
      - run: moon run --deny-warn checks/postgres.mbtx
